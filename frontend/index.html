<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#d6336c">
    <title>Beauty Products</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icones/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="icones/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icones/favicon-16x16.png">
    <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <div class="container cabecalho-marca">
        <img src="icones/android-chrome-192x192.png" alt="Logo Beauty Products" class="logo">
        <div>
          <h1>Beauty Products</h1>
          <p>Gerencie o catálogo de produtos de beleza</p>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="painel">
        <h2 id="titulo-formulario">Novo produto</h2>

        <form id="form-produto">
          <input type="hidden" id="produto-id">

          <label for="nome">Nome</label>
          <input id="nome" name="nome" type="text" required>

          <label for="marca">Marca</label>
          <input id="marca" name="marca" type="text" required>

          <label for="categoria">Categoria</label>
          <input id="categoria" name="categoria" type="text" placeholder="ex: batom, base">

          <label for="preco">Preço (R$)</label>
          <input id="preco" name="preco" type="number" min="0" step="0.01" required>

          <label for="descricao">Descrição</label>
          <textarea id="descricao" name="descricao"></textarea>

          <div class="acoes-formulario">
            <button type="submit" id="botao-salvar">Cadastrar</button>
            <button type="button" id="botao-cancelar" class="secundario oculto">
              Cancelar edição
            </button>
          </div>
        </form>
      </section>

      <section class="painel">
        <div class="cabecalho-lista">
          <h2>Catálogo</h2>
          <button type="button" id="botao-atualizar" class="secundario">Atualizar lista</button>
        </div>

        <form id="form-busca" class="busca">
          <label for="busca-id">Buscar produto pelo ID</label>
          <div class="linha-busca">
            <input id="busca-id" type="text" placeholder="Informe o ID do produto">
            <button type="submit">Buscar</button>
            <button type="button" id="botao-limpar-busca" class="secundario">Listar todos</button>
          </div>
        </form>

        <p id="mensagem" role="status" aria-live="polite"></p>
        <div id="lista-produtos" class="lista-produtos"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
